[project]
name = "uci-online-retail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "lightgbm>=4.6.0",
    "llvmlite>=0.45,<0.46",
    "matplotlib>=3.10.9",
    # numpy 2.4+ pulls numba>=0.64 → llvmlite>=0.46, which has no macOS x86_64 wheels
    # for CPython 3.12. Cap below 2.4 so SHAP/numba can use llvmlite 0.45 (Intel Mac wheels).
    "mlxtend>=0.24.0",
    "networkx>=3.6.1",
    "numba>=0.62,<0.63",
    "numpy>=2.3,<2.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "uvicorn[standard]>=0.48.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
